<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teste de configuração · Point Ball</title>
<link rel="stylesheet" href="/css/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Ccircle cx=%228%22 cy=%228%22 r=%227%22 fill=%22%23ffcc33%22/%3E%3C/svg%3E">
</head>
<body>
<div class="teste">
  <aside>
    <div class="row" style="justify-content:space-between"><a href="/" class="btn">← Início</a><b style="color:var(--accent)">/teste</b></div>
    <p class="muted small">Ajuste tudo e teste ao vivo. Depois clique em <b>Baixar config</b> e me mande o arquivo <code>game-config.json</code>.</p>
    <div class="row">
      <button class="btn primary" id="btn-dl">⬇ Baixar config</button>
      <button class="btn" id="btn-copy">Copiar JSON</button>
    </div>
    <div class="row" style="margin-top:8px">
      <label class="btn" style="margin:0;color:var(--text)">Importar JSON<input type="file" id="file-in" accept=".json,application/json" hidden></label>
      <button class="btn danger" id="btn-reset">Restaurar padrão</button>
    </div>

    <div class="cfg-group"><h4>Cenário de teste</h4>
      <label>Mapa</label>
      <select id="t-map"><option value="deserto">Deserto</option><option value="neve">Neve</option><option value="floresta">Floresta</option><option value="escuro">Sala escura</option><option value="portal">Portais</option><option value="cidade">Cidade à noite</option><option value="vulcao">Vulcão</option><option value="nave">Nave espacial</option></select>
      <div class="cfg-item"><span>Bots inimigos</span><input type="number" id="t-bots" min="0" max="5" value="2"></div>
      <label class="row" style="color:var(--text)"><input type="checkbox" id="t-smart" checked> Bots inteligentes (iguais aos da sala)</label>
      <label>Nível dos bots</label>
      <select id="t-level"><option value="iniciante">Iniciante</option><option value="amador" selected>Amador</option><option value="pro">Profissional</option></select>
            <label class="row" style="color:var(--text)"><input type="checkbox" id="t-botmove" checked> Bots andam</label>
      <label class="row" style="color:var(--text)"><input type="checkbox" id="t-botshoot"> Bots atiram</label>
      <button class="btn" id="btn-respawn" style="width:100%;margin-top:6px">Reiniciar posições</button>
    </div>
    <div id="cfg-panel"></div>
  </aside>
  <main><canvas id="game-canvas"></canvas><div id="hud-root"></div></main>
</div>

<script src="/js/common.js"></script>
<script src="/shared/config.js"></script>
<script src="/shared/maps.js"></script>
<script src="/shared/game.js"></script>
<script src="/shared/bots.js"></script>
<script src="/js/render.js"></script>
<script src="/js/hud.js"></script>
<script src="/js/teste.js"></script>
</body>
</html>
