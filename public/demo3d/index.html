<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Demo 3D · Three.js · Point Ball</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Ccircle cx=%228%22 cy=%228%22 r=%227%22 fill=%22%23ffcc33%22/%3E%3C/svg%3E">
<style>
  html, body { margin: 0; height: 100%; background: #0b0f17; color: #e5e7eb; font: 14px/1.35 "Segoe UI", system-ui, sans-serif; overflow: hidden; }
  #view { position: fixed; inset: 0; display: block; width: 100%; height: 100%; cursor: crosshair; }
  .panel { position: fixed; background: rgba(10, 14, 22, .82); border: 1px solid #243044; border-radius: 10px; padding: 10px 12px; }
  #hud { top: 12px; left: 12px; min-width: 210px; }
  #hud .big { font-size: 20px; font-weight: 800; }
  #hud .row { display: flex; gap: 10px; align-items: center; margin-top: 4px; }
  #opts { top: 12px; right: 12px; display: grid; gap: 6px; }
  #opts label { display: flex; justify-content: space-between; gap: 10px; align-items: center; }
  #opts select { background: #111827; color: #e5e7eb; border: 1px solid #334155; border-radius: 6px; padding: 3px 6px; }
  #fps { font-variant-numeric: tabular-nums; color: #86efac; font-weight: 800; }
  #help { bottom: 12px; left: 50%; transform: translateX(-50%); font-size: 12px; color: #94a3b8; white-space: nowrap; }
  #feed { top: 12px; left: 50%; transform: translateX(-50%); text-align: center; font-weight: 700; }
  .tA { color: #60a5fa; } .tB { color: #f87171; }
  .lost { opacity: .25; }
  h1 { margin: 0 0 4px; font-size: 13px; color: #ffcc33; letter-spacing: .06em; }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div class="panel" id="hud">
  <h1>POINT BALL · DEMO 3D (THREE.JS)</h1>
  <div class="row"><span id="h-lives"></span> <span id="h-bombs"></span></div>
  <div class="row"><span class="big" id="h-ammo">20</span><span id="h-mags"></span></div>
  <div class="row" id="h-jump"></div>
  <div class="row">FPS: <span id="fps">--</span> <span id="hz" style="color:#94a3b8"></span></div>
  <div class="row" id="h-kda" style="color:#94a3b8"></div>
</div>
<div class="panel" id="feed" style="display:none"></div>
<div class="panel" id="opts">
  <label>Mapa <select id="o-map"><option value="deserto">Deserto</option><option value="neve">Neve</option><option value="floresta">Floresta</option><option value="nave">Nave espacial</option></select></label>
  <label>Bots <select id="o-bots"><option>0</option><option>1</option><option selected>2</option><option>3</option><option>5</option></select></label>
  <label>Nível <select id="o-level"><option value="iniciante">Iniciante</option><option value="amador" selected>Amador</option><option value="pro">Profissional</option></select></label>
  <label>Câmera <select id="o-cam"><option value="tilt">Inclinada</option><option value="top">De cima</option><option value="low">Baixa</option></select></label>
  <label>Sombras <select id="o-shadow"><option value="1">Ligadas</option><option value="0">Desligadas</option></select></label>
</div>
<div class="panel" id="help">WASD: andar · Mouse: mirar · Clique: atirar · Botão direito: bomba · Rodinha: fumaça · Espaço: pulo · 1/2: arma/faca · R: recarregar · C: trocar câmera</div>

<script src="/shared/config.js"></script>
<script src="/shared/maps.js"></script>
<script src="/shared/game.js"></script>
<script src="/shared/bots.js"></script>
<script src="/js/hud.js"></script>
<script type="importmap">{ "imports": { "three": "/vendor/three/three.module.js" } }</script>
<script type="module" src="/demo3d/demo3d.js"></script>
</body>
</html>
