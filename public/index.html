<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Point Ball</title>
<link rel="stylesheet" href="/css/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Ccircle cx=%228%22 cy=%228%22 r=%227%22 fill=%22%23ffcc33%22/%3E%3C/svg%3E">
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="logo">POINT<span>BALL</span></div>
    <div class="row">
      <span id="me-chip" class="row"></span>
      <button class="btn" id="btn-profile">👤 Perfil</button>
      <a class="btn" href="/teste">⚙️ /teste</a>
    </div>
  </div>

  <div class="grid2">
    <div class="card">
      <h2>Criar sala</h2>
      <label>Nome da sala (1 a 5 letras ou números)</label>
      <input type="text" id="c-name" maxlength="5" placeholder="Ex: ABC12" autocomplete="off">
      <label>Senha (opcional, 3 a 6 caracteres)</label>
      <input type="password" id="c-pass" maxlength="6" placeholder="Deixe vazio para sala aberta" autocomplete="new-password">
      <div class="row">
        <div class="grow"><label>Mapa</label>
          <select id="c-map"><option value="deserto">Deserto</option><option value="neve">Neve</option><option value="floresta">Floresta</option></select></div>
        <div class="grow"><label>Rounds</label>
          <select id="c-rounds"><option>1</option><option>2</option><option selected>3</option><option>5</option><option>7</option></select></div>
      </div>
      <div class="error" id="c-err"></div>
      <button class="btn primary big" id="btn-create" style="width:100%;margin-top:6px">Criar sala</button>
    </div>

    <div class="card">
      <h2>Entrar em uma sala</h2>
      <div class="row">
        <input type="text" id="j-code" class="grow" maxlength="5" placeholder="Código da sala" style="flex:1" autocomplete="off">
        <button class="btn primary" id="btn-join">Entrar</button>
      </div>
      <h3 style="margin-top:18px">Salas abertas</h3>
      <div class="room-list" id="room-list"><div class="muted small">Carregando...</div></div>
    </div>
  </div>
</div>

<script src="/js/common.js"></script>
<script src="/socket.io/socket.io.js"></script>
<script>
  const $ = (id) => document.getElementById(id);
  const socket = io();

  function renderMe() {
    const p = PB.getProfile();
    $('me-chip').innerHTML = PB.avatarHTML(p, 32) + ' <b>' + PB.esc(p.name) + '</b>';
  }
  renderMe();
  $('btn-profile').onclick = () => PB.openProfile(renderMe);

  $('c-name').addEventListener('input', (e) => { e.target.value = e.target.value.replace(/[^a-z0-9]/gi, '').toUpperCase(); });
  $('j-code').addEventListener('input', (e) => { e.target.value = e.target.value.replace(/[^a-z0-9]/gi, '').toUpperCase(); });

  $('btn-create').onclick = () => {
    const name = $('c-name').value.trim(), pass = $('c-pass').value;
    $('c-err').textContent = '';
    if (!/^[A-Za-z0-9]{1,5}$/.test(name)) return ($('c-err').textContent = 'Nome da sala: 1 a 5 letras ou números.');
    if (pass && (pass.length < 3 || pass.length > 6)) return ($('c-err').textContent = 'Senha: mínimo 3 e máximo 6 caracteres.');
    $('btn-create').disabled = true;
    socket.emit('create_room', { name, password: pass, map: $('c-map').value, rounds: Number($('c-rounds').value), clientId: PB.clientId() }, (res) => {
      $('btn-create').disabled = false;
      if (!res || !res.ok) return ($('c-err').textContent = (res && res.error) || 'Erro ao criar sala.');
      try { if (pass) sessionStorage.setItem('pb_pw_' + res.code, pass); } catch (e) {}
      location.href = '/sala/' + res.code;
    });
  };

  const join = () => {
    const code = $('j-code').value.trim();
    if (code) location.href = '/sala/' + code.toUpperCase();
  };
  $('btn-join').onclick = join;
  $('j-code').addEventListener('keydown', (e) => { if (e.key === 'Enter') join(); });

  async function loadRooms() {
    try {
      const list = await (await fetch('/api/rooms')).json();
      if (!list.length) { $('room-list').innerHTML = '<div class="muted small">Nenhuma sala aberta. Crie a sua!</div>'; return; }
      $('room-list').innerHTML = list.map((r) => `
        <div class="room-item">
          <span class="code">${PB.esc(r.code)}</span>
          ${r.locked ? '<span title="Com senha">🔒</span>' : ''}
          <span class="badge">${PB.esc(PB.MAP_NAME[r.map] || r.map)}</span>
          <span class="badge">${r.rounds} round${r.rounds > 1 ? 's' : ''}</span>
          ${r.phase === 'match' ? '<span class="badge live">em partida</span>' : ''}
          <span class="grow muted small" style="flex:1;text-align:right">${r.players}/10 ${r.queue ? '· fila ' + r.queue : ''}</span>
          <a class="btn" href="/sala/${encodeURIComponent(r.code)}">Entrar</a>
        </div>`).join('');
    } catch (e) {}
  }
  loadRooms();
  setInterval(loadRooms, 4000);
</script>
</body>
</html>
